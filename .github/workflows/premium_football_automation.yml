name: Premium Football (Penalty & Over 1.5) Automation

on:
  workflow_dispatch:

concurrency:
  group: penalty-scan
  cancel-in-progress: true

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests typing_extensions beautifulsoup4

      - name: ⚡ Run Premium Unibet France Scan (Over 2.5 & Penalty)
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/auto_premium_unibet.py

      - name: 📄 Upload Premium Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-football-report
          path: |
            report.md
            all_scores.txt

      - name: 💾 Commit and Push Odds History & Backtest Ledger
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add previous_odds.json backtest_ledger.json docs/data.json docs/all_scores.html docs/email.html docs/mail.html report.md
          git diff --staged --quiet || git commit -m "Auto-update odds, backtest ledger & live docs data [skip ci]"
          for i in {1..5}; do
            git fetch origin master
            git rebase -X ours origin/master && git push origin master && exit 0
            sleep 2
          done
          echo "Warning: Could not push after 5 retries"
