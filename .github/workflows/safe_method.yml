name: SAFE Method - Combines Triples Domicile

on:
  workflow_dispatch:

concurrency:
  group: safe-method
  cancel-in-progress: true

jobs:
  safe-email:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run SAFE Method scan & send email
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RECIPIENT_EMAILS: ${{ secrets.EMAIL_TO || 'gregory.langlet@sfr.fr, langlet.gregory@gmail.com' }}
        run: python scripts/safe_unibet_email.py

      - name: 💾 Commit and Push Docs Page
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/email.html docs/mail.html
          git diff --staged --quiet || git commit -m "Auto-update safe email docs [skip ci]"
          for i in {1..5}; do
            git fetch origin master
            git rebase -X ours origin/master && git push origin master && exit 0
            sleep 2
          done
